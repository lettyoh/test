<style>
  :root{
    --bg1:#170c36;
    --bg2:#291757;
    --bg3:#3a2180;
    --gold:#FFD93D;
    --gold2:#FF9F5A;
    --ink:#1c1240;
    --muted:rgba(255,255,255,.68);
    --glass:rgba(255,255,255,.08);
    --glass-brd:rgba(255,255,255,.16);
    --font-display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    min-height:100vh;
    min-height:100dvh;
    font-family:var(--font-body);
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
    color:#fff;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  #app{
    position:relative;
    width:100%;
    max-width:480px;
    min-height:100vh;
    min-height:100dvh;
    overflow:hidden;
  }

  /* ---------- Ambient background ---------- */
  .stars-bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .twinkle{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{
    0%,100%{opacity:.15;transform:scale(.8);}
    50%{opacity:.9;transform:scale(1.25);}
  }
  .floaty{position:absolute;opacity:.32;filter:drop-shadow(0 0 6px rgba(255,255,255,.3));animation:floatY 5s ease-in-out infinite;}
  .floaty.f1{top:8%;left:9%;font-size:1.5rem;animation-duration:6s;}
  .floaty.f2{top:13%;right:8%;font-size:1.2rem;animation-duration:4.6s;animation-delay:.6s;}
  .floaty.f3{bottom:10%;right:13%;font-size:1.7rem;animation-duration:5.4s;animation-delay:1.1s;}
  @keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

  .screens{position:relative;width:100%;height:100%;z-index:1;}

  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:40px 26px max(40px, env(safe-area-inset-bottom)) 26px;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .4s ease;
    overflow-y:auto;
  }
  .screen.active{opacity:1;visibility:visible;pointer-events:auto;}

  /* ---------- Start screen ---------- */
  .hero-orb{
    width:92px;height:92px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(255,217,61,.45) 42%, rgba(155,123,255,.35) 72%, transparent 100%);
    box-shadow:0 0 40px rgba(255,217,61,.3), 0 0 80px rgba(155,123,255,.25);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:22px;
    animation:floatY 3.4s ease-in-out infinite;
  }
  .hero-orb span{font-size:2rem;filter:drop-shadow(0 0 8px rgba(255,255,255,.85));}

  .main-copy{font-family:var(--font-display);font-size:clamp(1.5rem,6.5vw,2rem);font-weight:800;line-height:1.4;margin-bottom:14px;letter-spacing:-.01em;}
  .sub-copy{font-size:clamp(.95rem,4vw,1.05rem);color:var(--muted);margin-bottom:38px;}

  #startScreen>*{opacity:0;transform:translateY(14px);animation:revealUp .6s ease forwards;}
  #startScreen>*:nth-child(1){animation-delay:.1s;}
  #startScreen>*:nth-child(2){animation-delay:.25s;}
  #startScreen>*:nth-child(3){animation-delay:.4s;}
  #startScreen>*:nth-child(4){animation-delay:.55s;}

  .cta-btn{
    appearance:none;border:none;cursor:pointer;
    font-family:var(--font-display);
    font-size:1.05rem;font-weight:700;color:var(--ink);
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    padding:16px 40px;border-radius:999px;
    box-shadow:0 10px 26px rgba(255,159,90,.35);
    transition:transform .15s ease, box-shadow .15s ease;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  .cta-btn:active{transform:scale(.96);box-shadow:0 6px 16px rgba(255,159,90,.3);}
  .cta-btn:focus-visible{outline:2px solid #fff;outline-offset:3px;}
  @media (hover:hover){
    .cta-btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(255,159,90,.4);}
  }

  /* ---------- Card screen ---------- */
  .instruction{font-family:var(--font-display);font-size:clamp(1.05rem,4.5vw,1.25rem);font-weight:700;line-height:1.5;margin-bottom:40px;}
  .cards-row{display:flex;gap:16px;justify-content:center;width:100%;perspective:1000px;}
  .card{
    width:30%;max-width:118px;aspect-ratio:2/3;
    cursor:pointer;
    transition:transform .3s ease, opacity .3s ease;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    border-radius:16px;
  }
  .card.dim{opacity:.32;transform:scale(.92);}
  .card.selected{transform:scale(1.08);z-index:2;}
  .card:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
  @media (hover:hover){
    .card:not(.dim):not(.selected):hover{transform:translateY(-6px);}
  }
  .card-inner{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.34,1.56,.64,1);
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .card-face{
    position:absolute;inset:0;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    box-shadow:0 10px 26px rgba(0,0,0,.35);
  }
  .card-back{
    background:linear-gradient(145deg,#4a3ab0,#241653);
    border:1px solid rgba(255,255,255,.18);
    animation:pulseGlow 2.6s ease-in-out infinite;
  }
  .card-front{background:linear-gradient(145deg,#ffe9b8,#ffcf73);transform:rotateY(180deg);}
  .constellation{width:60%;height:60%;overflow:visible;}
  .constellation polyline{fill:none;stroke:rgba(255,255,255,.38);stroke-width:1.3;}
  .constellation .dot{fill:rgba(255,255,255,.7);}
  .constellation .dot.hero{fill:var(--gold);filter:drop-shadow(0 0 5px rgba(255,217,61,.9));}
  .reveal-spark{width:42%;height:42%;}
  .reveal-spark path{fill:#6b4a1c;}

  .cards-row .card:nth-child(1) .card-back{animation-delay:0s;}
  .cards-row .card:nth-child(2) .card-back{animation-delay:.4s;}
  .cards-row .card:nth-child(3) .card-back{animation-delay:.8s;}

  @keyframes pulseGlow{
    0%,100%{box-shadow:0 10px 26px rgba(0,0,0,.35),0 0 0 rgba(255,217,61,0);}
    50%{box-shadow:0 10px 26px rgba(0,0,0,.35),0 0 22px rgba(255,217,61,.35);}
  }

  /* ---------- Result screen ---------- */
  .result-card{
    width:100%;background:var(--glass);border:1px solid var(--glass-brd);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:24px;padding:30px 22px;
    box-shadow:0 16px 40px rgba(0,0,0,.3);
    text-align:left;
  }
  .result-card>*{opacity:0;transform:translateY(12px);}
  .result-card.reveal>*{animation:revealUp .55s ease forwards;}
  .result-card.reveal>*:nth-child(1){animation-delay:.05s;}
  .result-card.reveal>*:nth-child(2){animation-delay:.16s;}
  .result-card.reveal>*:nth-child(3){animation-delay:.28s;}
  .result-card.reveal>*:nth-child(4){animation-delay:.4s;}
  .result-card.reveal>*:nth-child(5){animation-delay:.5s;}
  .result-card.reveal>*:nth-child(6){animation-delay:.6s;}
  @keyframes revealUp{to{opacity:1;transform:translateY(0);}}

  .result-kicker{font-size:.85rem;color:var(--muted);letter-spacing:.06em;margin-bottom:8px;}
  .result-grade{
    font-family:var(--font-display);
    font-size:clamp(2rem,9vw,2.6rem);font-weight:800;margin-bottom:22px;display:inline-block;
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .grade-great{background:linear-gradient(135deg,#FFD93D,#FF7A6E);}
  .grade-good{background:linear-gradient(135deg,#6EC6FF,#9B7BFF);}
  .grade-small{background:linear-gradient(135deg,#5FD9C0,#9CC5A1);}
  .grade-normal{background:linear-gradient(135deg,#D7DCE5,#9CA9BE);}

  .stat-block{margin-bottom:20px;}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:1rem;}
  .stat-label{color:var(--muted);font-weight:500;}
  .stat-value{font-weight:700;}
  .stat-value.stars{color:var(--gold);letter-spacing:2px;}
  .percent-bar-track{width:100%;height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px;}
  .percent-bar-fill{height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width 1s cubic-bezier(.22,1,.36,1);}

  .chip-row{display:flex;gap:12px;margin-bottom:22px;}
  .chip{flex:1;background:rgba(255,255,255,.06);border-radius:14px;padding:12px 8px;text-align:center;}
  .chip-label{font-size:.7rem;color:var(--muted);margin-bottom:4px;}
  .chip-value{font-size:.95rem;font-weight:700;}
  .color-value{display:flex;align-items:center;gap:6px;justify-content:center;}
  .color-dot{width:13px;height:13px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.5);flex-shrink:0;}

  .msg-label{font-size:.78rem;color:var(--muted);margin-bottom:8px;font-weight:600;}
  .result-message{font-size:.98rem;line-height:1.7;color:rgba(255,255,255,.92);}

  .retry-btn{margin-top:26px;}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
  }
</style>
</head>
<body>

  var GRADE_CLASS = {'대길':'grade-great','길':'grade-good','소길':'grade-small','평범':'grade-normal'};

  function hashString(str){
    var hash = 5381;
    for(var i=0;i<str.length;i++){
      hash = ((hash << 5) + hash) + str.charCodeAt(i);
      hash |= 0;
    }
    return Math.abs(hash);
  }

  function todayKey(){
    var d = new Date();
    return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  }

  function getFortune(cardIndex){
    var key = todayKey()+'_card'+cardIndex;
    var h = hashString(key);
    return FORTUNES[h % FORTUNES.length];
  }

  var startScreen = document.getElementById('startScreen');
  var cardScreen = document.getElementById('cardScreen');
  var resultScreen = document.getElementById('resultScreen');
  var startBtn = document.getElementById('startBtn');
  var retryBtn = document.getElementById('retryBtn');
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var resultCard = document.getElementById('resultCard');

  var isBusy = false;

  function showScreen(target){
    [startScreen, cardScreen, resultScreen].forEach(function(s){ s.classList.remove('active'); });
    target.classList.add('active');
  }

  startBtn.addEventListener('click', function(){ showScreen(cardScreen); });

  function handleCardActivate(card){
    if(isBusy) return;
    isBusy = true;

    var idx = parseInt(card.getAttribute('data-index'), 10);
    var fortune = getFortune(idx);

    cards.forEach(function(c){
      if(c === card){ c.classList.add('selected'); }
      else { c.classList.add('dim'); }
    });

    setTimeout(function(){ card.classList.add('flipped'); }, 280);

    setTimeout(function(){
      renderResult(fortune);
      showScreen(resultScreen);
    }, 1150);
  }

  cards.forEach(function(card){
    card.addEventListener('click', function(){ handleCardActivate(card); });
    card.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        handleCardActivate(card);
      }
    });
  });

  function renderResult(fortune){
    resultCard.classList.remove('reveal');
    void resultCard.offsetWidth;

    var gradeEl = document.getElementById('resultGrade');
    gradeEl.textContent = fortune.grade;
    gradeEl.className = 'result-grade ' + (GRADE_CLASS[fortune.grade] || 'grade-normal');

    document.getElementById('moneyStars').textContent = '★'.repeat(fortune.stars) + '☆'.repeat(5 - fortune.stars);
    document.getElementById('luckPercent').textContent = fortune.percent + '%';
    document.getElementById('luckyKeyword').textContent = fortune.keyword;
    document.getElementById('luckyColor').textContent = fortune.color;
    document.getElementById('colorDot').style.backgroundColor = fortune.hex;
    document.getElementById('resultMessage').innerHTML = fortune.message.split('\n').join('<br>');

    var bar = document.getElementById('percentBar');
    bar.style.width = '0%';

    resultCard.classList.add('reveal');

    requestAnimationFrame(function(){
      setTimeout(function(){ bar.style.width = fortune.percent + '%'; }, 150);
    });
  }

  function resetCards(){
    isBusy = false;
    cards.forEach(function(c){ c.classList.remove('selected','dim','flipped'); });
  }

  retryBtn.addEventListener('click', function(){
    resetCards();
    showScreen(cardScreen);
  });

  function generateTwinkles(container, count){
    var frag = document.createDocumentFragment();
    for(var i=0;i<count;i++){
      var star = document.createElement('div');
      star.className = 'twinkle';
      star.style.left = (Math.random()*100)+'%';
      star.style.top = (Math.random()*100)+'%';
      var size = 2 + Math.random()*3;
      star.style.width = size+'px';
      star.style.height = size+'px';
      star.style.animationDelay = (Math.random()*4)+'s';
      star.style.animationDuration = (2.2 + Math.random()*3)+'s';
      frag.appendChild(star);
    }
    container.appendChild(frag);
  }

  generateTwinkles(document.getElementById('starsBg'), 36);

})();
</script>
